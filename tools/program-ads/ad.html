<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PHANET ad</title>
<style>
  @font-face { font-family: "Bricolage"; src: url(assets/bricolage-latin.woff2) format("woff2"); font-weight: 200 800; font-stretch: 75% 100%; unicode-range: U+0000-00FF, U+2000-206F, U+20B5; }
  @font-face { font-family: "Bricolage"; src: url(assets/bricolage-latin-ext.woff2) format("woff2"); font-weight: 200 800; font-stretch: 75% 100%; unicode-range: U+0100-02BA, U+2C60-2C7F; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "Bricolage", sans-serif; -webkit-font-smoothing: antialiased; }
  #frame { position: absolute; inset: 0; overflow: hidden; }
  svg#stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #text { position: absolute; inset: 0; pointer-events: none; }
  .w { display: inline-block; transform-origin: 50% 80%; }

  .kick { position: absolute; font-weight: 600; font-size: 44px; }
  .goldbox { position: absolute; background: #e8ad12; color: #000; font-weight: 800; font-stretch: 75%; text-transform: uppercase; line-height: 1; padding: 20px 32px 16px; font-variation-settings: "opsz" 96; }
  .tagbox { position: absolute; background: #fff; color: #141414; border: 4px solid #000; padding: 26px 34px; font-weight: 700; font-stretch: 85%; line-height: 1.12; }
  .pill { display: inline-block; border-radius: 999px; padding: 22px 42px; font-size: 42px; font-weight: 700; }
</style></head>
<body><div id="frame"><svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

  <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff2c4" stop-opacity="1"/><stop offset=".35" stop-color="#ffd36b" stop-opacity=".55"/><stop offset="1" stop-color="#ffd36b" stop-opacity="0"/></radialGradient>
  <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050b26"/><stop offset=".6" stop-color="#0e1d52"/><stop offset="1" stop-color="#22307a"/></linearGradient>
  <linearGradient id="dawnSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4fb8"/><stop offset=".45" stop-color="#f3a25a"/><stop offset="1" stop-color="#ffd890"/></linearGradient>

  <radialGradient id="spot" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#fff6d6" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/></radialGradient>
</defs></svg><div id="text"></div></div>
