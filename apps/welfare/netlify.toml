# Netlify site for welfare. Set "Base directory" to apps/welfare in the Netlify UI
# (this file is picked up from there) and add the env vars from .env.example.
[build]
  base = "apps/welfare"
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@phanet/welfare"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"

[[plugins]]
  package = "@netlify/plugin-nextjs"
