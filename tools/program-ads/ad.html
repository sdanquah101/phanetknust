<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PHANET program ad</title>
<style>
  @font-face { font-family: "Bricolage"; src: url(assets/bricolage-latin.woff2) format("woff2"); font-weight: 200 800; font-stretch: 75% 100%; unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Bricolage"; src: url(assets/bricolage-latin-ext.woff2) format("woff2"); font-weight: 200 800; font-stretch: 75% 100%; unicode-range: U+0100-02BA, U+02BD-02C5, U+2C60-2C7F; }
  :root { --gold: #e8ad12; --gold-text: #8a6400; --peach: #f6d77a; --blue: #1f3fff; --ink: #141414; --cream: #fbf8f1; --loom: #141210; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: "Bricolage", sans-serif; color: white; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; inset: 0; overflow: hidden; background: var(--loom); }
  .layer { position: absolute; inset: 0; overflow: hidden; }
  .photo { position: absolute; inset: -2%; background-size: cover; background-repeat: no-repeat; will-change: transform; }
  .shade-left { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,8,8,.86) 0%, rgba(8,8,8,.6) 38%, rgba(8,8,8,0) 72%); }
  .shade-bottom { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(8,8,8,.82) 0%, rgba(8,8,8,.25) 45%, rgba(8,8,8,0) 70%); }
  .cloth { position: absolute; inset: 0; display: flex; overflow: hidden; background: var(--loom); }
  .cloth > i { flex: 0 0 auto; height: 100%; background-repeat: repeat-y; background-size: 100% auto; box-shadow: inset 6px 0 12px -8px rgba(0,0,0,.6), inset -6px 0 12px -8px rgba(0,0,0,.6); }
  .cloth::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, rgba(255,255,255,0) 20%, rgba(255,240,200,.10) 45%, rgba(255,255,255,0) 65%), linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,0) 14%, rgba(0,0,0,0) 86%, rgba(0,0,0,.3)); }
  .cloth-shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(8,8,8,.55), rgba(8,8,8,.84) 72%); }
  .present { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .present p { font-size: 40px; font-weight: 500; color: var(--peach); letter-spacing: .02em; }
  .present h2 { font-size: 132px; font-weight: 800; font-stretch: 75%; line-height: .9; text-transform: uppercase; margin-top: 10px; font-variation-settings: "opsz" 96; }
  .stole { position: absolute; left: 96px; top: 0; width: 84px; height: 78%; background-repeat: repeat-y; background-size: 100% auto; box-shadow: 8px 14px 30px rgba(0,0,0,.45); transform-origin: 50% 0; }
  .stole::after { content: ""; position: absolute; left: 6%; right: 6%; top: 100%; height: 40px; background: repeating-linear-gradient(90deg, #e2a610 0 2px, transparent 2px 4px, #181614 4px 5px, transparent 5px 7px); -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent); }
  .title { position: absolute; left: 240px; bottom: 150px; max-width: 1200px; }
  .kicker { font-size: 44px; font-weight: 500; color: var(--peach); margin-bottom: 18px; }
  .name { font-size: 196px; font-weight: 800; font-stretch: 75%; line-height: .86; text-transform: uppercase; letter-spacing: -.01em; font-variation-settings: "opsz" 96; }
  .name span { display: block; overflow: hidden; padding-bottom: .04em; }
  .name span b { display: block; font-weight: inherit; }
  .strips { position: absolute; inset: 0; display: flex; }
  .strip { position: relative; height: 100%; overflow: hidden; flex: 0 0 auto; }
  .strip + .strip { box-shadow: inset 1px 0 0 rgba(0,0,0,.35); }
  .reel { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
  .reel > span { display: block; width: 100%; background-repeat: no-repeat; }
  .reel > span.k { background-repeat: repeat-y; background-size: 100% auto; box-shadow: inset 0 12px 14px -10px rgba(0,0,0,.6), inset 0 -12px 14px -10px rgba(0,0,0,.6); }
  .tag-box { position: absolute; left: 140px; bottom: 140px; max-width: 1180px; background: white; color: var(--ink); border: 4px solid black; padding: 34px 42px; }
  .tag-box p { font-size: 58px; font-weight: 600; line-height: 1.18; font-stretch: 88%; }
  .tag-box::before { content: ""; position: absolute; left: 70px; bottom: 100%; width: 4px; height: 40px; background: black; }
  .sched { position: absolute; left: 140px; bottom: 150px; }
  .sched .when { display: inline-block; background: var(--gold); color: black; font-size: 92px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; line-height: 1; padding: 22px 34px 18px; font-variation-settings: "opsz" 96; }
  .sched .where { margin-top: 22px; font-size: 46px; font-weight: 500; color: white; }
  .end { position: absolute; inset: 0; background: var(--cream); color: var(--ink); }
  .end .band { position: absolute; left: 0; right: 0; }
  .end .inner { position: absolute; inset: 150px 0 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .end .brand { display: flex; align-items: center; gap: 22px; font-size: 38px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-stretch: 90%; }
  .end .brand img { width: 84px; height: 84px; border-radius: 50%; background: white; box-shadow: 0 0 0 2px rgba(0,0,0,.08); }
  .end h3 { margin-top: 34px; font-size: 150px; font-weight: 800; font-stretch: 75%; line-height: .88; text-transform: uppercase; color: black; font-variation-settings: "opsz" 96; }
  .end .when { margin-top: 26px; font-size: 52px; font-weight: 600; color: var(--gold-text); }
  .end .cta { margin-top: 44px; display: flex; gap: 22px; align-items: center; }
  .end .pill { border-radius: 999px; padding: 24px 46px; font-size: 44px; font-weight: 700; }
  .end .pill.black { background: black; color: white; }
  .end .pill.line { border: 4px solid black; color: black; }
  .end .theme { position: absolute; left: 0; right: 0; bottom: 92px; text-align: center; font-size: 30px; font-weight: 600; color: #5f5f5f; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="kente.js"></script>
<script src="programs.js"></script>
<script src="ad.js"></script>
</body>
</html>
